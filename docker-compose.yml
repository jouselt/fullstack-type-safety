services:
  postgres:
    image: postgres:16
    container_name: fullstack-type-safety-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fullstack_type_safety
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fullstack_type_safety"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
