name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Typecheck (end-to-end types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same path as the documented quickstart: fresh clone -> .env from example -> generate.
      # `prisma generate` needs no database, only the schema + env file referenced by prisma.config.ts.
      - name: Generate Prisma client
        run: |
          cp apps/api/.env.example apps/api/.env
          npm run db:generate -w api

      # api: tsc --noEmit · web: ng build (full template type-check)
      - name: Typecheck api + build web
        run: npm run typecheck
